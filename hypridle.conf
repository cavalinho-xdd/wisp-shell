# wisp-shell idle daemon config — run via: hypridle -c <this file>
# (scripts/idle_takeover.sh does exactly that; idle_restore.sh undoes it.)
# Never installed over the user's ~/.config/hypr/hypridle.conf — same
# sandbox contract as the settings app.
#
# Flow: idle 5 min → loginctl lock-session → logind emits Lock → hypridle
# runs $lock_cmd → qs -p lock.qml (guarded against double-launch).
# 10 min → screens off. 15 min → suspend (locks first via before_sleep).

$lock_cmd = pgrep -f 'qs -p .*wisp-shell/lock\.qml' || qs -p ~/coding/wisp-shell/lock.qml

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5 min — lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10 min — screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15 min — suspend
    on-timeout = systemctl suspend || loginctl suspend
}
