[General]
# The ember colour and glow strength, copied from Wisp by scripts/sddm_sync.sh.
ember=#8fd3ff
glow=1.0
# Relative to this folder; sddm_sync.sh replaces it with your wallpaper.
background=background.jpg
# SDDM has no system reduce-motion signal: true stops the drift, breathing
# and tick and keeps short fades.
reduceMotion=false
